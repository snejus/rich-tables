[tool.poetry]
name = "rich-tables"
version = "0.9.0"
description = "Ready-made rich tables for various purposes"
authors = ["Šarūnas Nejus <snejus@pm.me>"]
readme = "README.md"
license = "MIT"
homepage = "https://github.com/snejus/rich-tables"
repository = "https://github.com/snejus/rich-tables"

keywords = ["json", "pretty", "rich", "console", "terminal"]
classifiers = [
    "Development Status :: 1 - Planning",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Intended Audience :: System Administrators",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Utilities",
]

[tool.poetry.dependencies]
python = ">=3.10,<4"

multimethod = ">=2"
rgbxy = ">=0.5"
platformdirs = ">=4.2.0"
rich = ">=12.3.0"
sqlparse = ">=0.4.4"
typing-extensions = ">=4.7.1"
humanize = ">=4.11.0"
coloraide = ">=4.1"
decorator = ">=5.2.1" # required for rich -_-

[tool.poetry.group.dev.dependencies]
mypy = ">=0.910"
ruff = ">=0.16.0"

pytest = ">=7"
pytest-clarity = ">=1.0.1"
pytest-cov = ">=3.0.0"
pytest-sugar = "*"
freezegun = ">=1.2.1"

types-freezegun = ">=1.1.9"
coveralls = ">=3.3.1"
snoop = ">=0.4.3"

[tool.poetry.extras]
hue = ["rgbxy"]

[tool.poetry.scripts]
table = "rich_tables.table:main"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
target-version = "py310"

[tool.ruff.format]
skip-magic-trailing-comma = true

[tool.ruff.lint]
future-annotations = true
select = [
    "A", # flake8-builtins
    "ARG", # flake8-unused-arguments
    "B", # flake8-bugbear
    "C4", # flake8-comprehensions
    "E", # pycodestyle errors
    "ERA", # flake8-eradicate
    "F", # pyflakes
    "G", # flake8-logging-format
    "I", # isort
    "ISC", # flake8-implicit-str-concat
    "N", # pep8-naming
    "PIE", # flake8-pie
    "PL", # pylint
    "PT", # flake8-pytest-style
    "RET", # flake8-return
    "RUF", # ruff
    "S", # flake8-bandit
    "UP", # pyupgrade
    "TC", # flake8-type-checking
    "W", # pycodestyle warnings
]
ignore = [
    "TC006", # no need to quote 'cast's since we use 'from __future__ import annotations'
    "B905", # it's fine to use zip without explicit `strict=False`
    "N815", # we need mixedCase names since we parse external JSON data
]

[tool.ruff.lint.isort]
split-on-trailing-comma = false

[tool.ruff.lint.flake8-pytest-style]
fixture-parentheses = false
mark-parentheses = false
parametrize-names-type = "csv"

[tool.ruff.lint.flake8-unused-arguments]
ignore-variadic-names = true

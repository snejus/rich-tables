name: Code quality
on: push
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v6
        with:
          # Need to read all commits in order to git describe project's version
          fetch-depth: 0

      - name: Install poetry
        run: pip install poetry

      - name: Set up Python ${{ matrix.python }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          cache: poetry

      - name: Install dependencies
        run: poetry install --all-extras

      - name: Pytest
        run: poetry run pytest -s -vv

      - name: Upload coverage data to coveralls.io
        run: poetry run coveralls --service=github
        continue-on-error: true

      - name: Lint ruff
        run: poetry run ruff check --exit-zero --output-format=json --output-file=.reports/ruff.json .

      - name: Lint mypy
        run: poetry run mypy rich_tables > .reports/mypy.log || true

      - name: Set project version
        run: echo PROJECT_VERSION="$(git describe --tags | sed 's/-[^-]*$//')" >> $GITHUB_ENV

      - name: SonarCloud Scan
        if: matrix.python == '3.10'
        uses: SonarSource/sonarqube-scan-action@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >-
            -Dsonar.branch.name=${{ github.ref_name }}
            -Dsonar.organization=snejus
            -Dsonar.projectKey=snejus_rich-tables
            -Dsonar.projectVersion=${{ env.PROJECT_VERSION }}
            -Dsonar.coverage.exclusions=tests/*
            -Dsonar.exclusions=tests/*
            -Dsonar.python.coverage.reportPaths=.reports/coverage.xml
            -Dsonar.python.ruff.reportPaths=.reports/ruff.json
            -Dsonar.python.mypy.reportPaths=.reports/mypy.log
            -Dsonar.python.version=${{ matrix.python }}
            -Dsonar.python.xunit.reportPath=.reports/test-report.xml
            -Dsonar.sources=rich_tables
            -Dsonar.tests=tests
            -Dsonar.test.inclusions=tests/*
